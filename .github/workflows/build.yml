name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack all zips in order
        run: |
          mkdir -p _proj
          for z in $(ls *.zip 2>/dev/null | sort -V); do
            echo "Unpacking $z"
            rm -rf _tmp && mkdir _tmp
            unzip -q -o "$z" -d _tmp
            cp -a _tmp/*/. _proj/
          done
          rm -rf _tmp
          ls -a _proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        run: cd _proj && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyCozyHouse-debug
          path: _proj/app/build/outputs/apk/debug/*.apk
