name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unpack all zips in order
        run: |
          mkdir -p _proj
          for z in $(ls *.zip 2>/dev/null | sort -V); do
            echo "Unpacking $z"
            rm -rf _tmp && mkdir _tmp
            unzip -q -o "$z" -d _tmp
            cp -a _tmp/*/. _proj/
          done
          rm -rf _tmp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build
        run: cd _proj && gradle assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: MyCozyHouse-debug
          path: _proj/app/build/outputs/apk/debug/*.apk
